"$schema" = 'https://starship.rs/config-schema.json'
command_timeout = 5000
add_newline = true

format = """
[](username_neon_green)\
$os\
$username\
$hostname\
[](bg:directory_dark_baby_blue fg:username_neon_green)\
$directory\
[](bg:branch_yellow fg:directory_dark_baby_blue)\
$git_branch\
$git_status\
[](fg:branch_yellow bg:lavendar)\
${custom.maven_version}\
[](fg:lavendar bg:green)\
$java\
$kotlin\
$python\
[ ](fg:green)\
$line_break
$cmd_duration\
$character"""

palette = 'custom'

[os]
disabled = false
style = "bg:username_neon_green fg:crust"

[username]
show_always = true
style_user = "bg:username_neon_green fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[hostname]
ssh_only = false
format = "[@$hostname](bg:username_neon_green fg:crust)"

[directory]
style = "bg:directory_dark_baby_blue fg:crust"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false
#truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:branch_yellow"
format = '[[ $symbol $branch ](fg:crust bg:branch_yellow)]($style)'

[git_status]
style = "fg:crust bg:branch_yellow"
format = '[\[$ahead_behind$up_to_date\]\[$staged\]\[$conflicted$modified$untracked$renamed$deleted$stashed\]]($style)'
conflicted = '[⚔ ](fg:red bg:branch_yellow)'
ahead = '[⇡$count](fg:dark_green bg:branch_yellow)'
behind = '[⇣$count](fg:red bg:branch_yellow)'
diverged = '[⇡${ahead_count}⇣${behind_count}](fg:red bg:branch_yellow)'
up_to_date = '[✓](fg:dark_green bg:branch_yellow)'
untracked = '[?$count ](fg:red bg:branch_yellow)'
stashed = '[⚑](fg:crust bg:branch_yellow)'
modified = '[!$count ](fg:red bg:branch_yellow)'
staged = '[+$count](fg:dark_green bg:branch_yellow)'
renamed = '[»$count ](fg:dark_green bg:branch_yellow)'
deleted = '[✘$count ](fg:red bg:branch_yellow)'
#format = '[[($all_status$ahead_behind )](fg:crust bg:branch_yellow)]($style)'

[package]
disabled = true

[custom.maven_version]
command = '''grep -m 1 '<version>' pom.xml | sed -E 's/.*<version>(.*)<\/version>.*/\1/' | tr -d '[:space:]' '''
detect_files = ['pom.xml']
format = '[ 📦 $output ]($style)'
style = "bg:lavendar fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:lavendar"
format = '[[  $time ](fg:crust bg:lavendar)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:red)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavendar)'
vimcmd_replace_symbol = '[❮](bold fg:lavendar)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in [$duration](bold yellow) "
style = "bg:lavendar"
disabled = false
show_notifications = true
min_time_to_notify = 1000

